# Monarch-local window rules.
# Base rules (suppress maximize event, default opacity, XWayland no_focus fix)
# are inherited from omarchy's default windows.conf, sourced before this file.
# Only add rules that are genuinely Monarch-specific here.

# Float the bluetui TUI client
windowrule = float on, match:class bluetui

# Per-app window rules
source = ~/.config/omarchy/themes/monarch/.config/hypr/configs/apps.conf
