# Monarch theme — Hyprland overrides ONLY.
#
# The base look & feel and window rules come from omarchy's maintained defaults,
# which ~/.config/hypr/hyprland.conf sources (default/hypr/looknfeel.conf and
# default/hypr/windows.conf) BEFORE this file. Keep this minimal: only redefine
# what is genuinely Monarch-specific, so that when Hyprland renames or removes an
# option, omarchy's own migrations handle it instead of a frozen copy here.

# Monarch identity: bioluminescent cyan/green border gradient
general {
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
}

# Monarch blur feel (overrides only these values; the rest inherits the default)
decoration {
    blur {
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# Slightly slower window animation than default
animations {
    animation = windows, 1, 4.79, easeOutQuint
}

# Monarch-local window rules (base rules inherited from default windows.conf)
source = ~/.config/omarchy/themes/monarch/.config/hypr/configs/windows.conf
